[custom]
;==============================
; 通用 OpenClash INI 模板
; "Aladdin Network" 已改名为 "默认代理"
; 适用于所有订阅，使用 .* 通配符匹配全部节点
;==============================

;基础设置
enable_rule_generator=true
overwrite_original_rules=true
clash_rule_base=https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GeneralClashConfig.yml

;==============================
; 策略组定义
;==============================

;默认代理 - 主选择组（原 Aladdin Network）
custom_proxy_group=默认代理`select`[]DIRECT`.*

;Telegram
custom_proxy_group=Telegram`select`[]默认代理`[]DIRECT`.*

;ChatGPT
custom_proxy_group=ChatGPT`select`[]默认代理`[]DIRECT`.*

;Claude
custom_proxy_group=Claude`select`[]默认代理`[]DIRECT`.*

;Gemini
custom_proxy_group=Gemini`select`[]默认代理`[]DIRECT`.*

;Bili - 默认直连
custom_proxy_group=Bili`select`[]DIRECT`[]默认代理`.*

;Bahamut
custom_proxy_group=Bahamut`select`[]默认代理`[]DIRECT`.*

;Github
custom_proxy_group=Github`select`[]默认代理`[]DIRECT`.*

;Crypto
custom_proxy_group=Crypto`select`[]默认代理`[]DIRECT`.*

;Discord
custom_proxy_group=Discord`select`[]默认代理`[]DIRECT`.*

;Youtube
custom_proxy_group=Youtube`select`[]默认代理`[]DIRECT`.*

;Netflix
custom_proxy_group=Netflix`select`[]默认代理`[]DIRECT`.*

;Disney
custom_proxy_group=Disney`select`[]默认代理`[]DIRECT`.*

;Pikpak
custom_proxy_group=Pikpak`select`[]默认代理`[]DIRECT`.*

;HBO
custom_proxy_group=HBO`select`[]默认代理`[]DIRECT`.*

;OtherMedia - 其他海外媒体
custom_proxy_group=OtherMedia`select`[]默认代理`[]DIRECT`.*

;Paypal
custom_proxy_group=Paypal`select`[]默认代理`[]DIRECT`.*

;Twitter
custom_proxy_group=Twitter`select`[]默认代理`[]DIRECT`.*

;Apple
custom_proxy_group=Apple`select`[]默认代理`[]DIRECT`.*

;WeChat - 默认直连
custom_proxy_group=WeChat`select`[]DIRECT`[]默认代理`.*

;Steam
custom_proxy_group=Steam`select`[]默认代理`[]DIRECT`.*

;SteamCN - 默认直连
custom_proxy_group=SteamCN`select`[]DIRECT`[]默认代理`.*

;Microsoft
custom_proxy_group=Microsoft`select`[]默认代理`[]DIRECT`.*

;Final - 漏网之鱼
custom_proxy_group=Final`select`[]默认代理`[]DIRECT`.*

